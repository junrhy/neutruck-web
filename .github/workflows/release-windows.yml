name: Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'Product R2 Slug'
        required: false
        default: 'neutruck-product'
      prefix:
        description: 'Installer Prefix'
        required: false
        default: 'neutruck'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Stamp Build Info & Version
        shell: bash
        run: |
          BUILD_TIMESTAMP=$(date +"%Y%m%d-%H%M")
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV
          
          cat > src/buildInfo.ts <<EOF
          // ⚠️ AUTO-GENERATED by GitHub Actions — DO NOT EDIT MANUALLY
          export const BUILD_TIMESTAMP = "${BUILD_TIMESTAMP}";
          export const PROD_SLUG        = "${{ inputs.app_slug || 'neutruck-product' }}";
          export const LATEST_MANIFEST_URL = "https://download.neulify.com/${{ inputs.app_slug || 'neutruck-product' }}/downloads/latest.json";
          EOF

          node -e "
            const fs = require('fs');
            const ts = '${BUILD_TIMESTAMP}';
            const m = ts.match(/^(\d{4})(\d{4})-(\d{4})\$/);
            const semver = m ? (parseInt(m[1]) + '.' + parseInt(m[2]) + '.' + parseInt(m[3])) : '0.1.0';
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = semver;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            console.log('✅ tauri.conf.json version →', semver);
          "

      - name: Build Tauri Windows App (Native makensis)
        run: npx tauri build

      - name: Upload Windows Setup Installer to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          PROD_SLUG="${{ inputs.app_slug || 'neutruck-product' }}"
          PREFIX="${{ inputs.prefix || 'neutruck' }}"
          BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"
          R2_BUCKET="neulify-desktop-apps"
          BASE_URL="https://download.neulify.com"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          WIN_FILE=$(find src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi -name "*.exe" -o -name "*.msi" 2>/dev/null | head -n 1)

          if [ -z "$WIN_FILE" ]; then
            WIN_FILE=$(find src-tauri/target/release -maxdepth 1 -name "*.exe" 2>/dev/null | head -n 1)
          fi

          if [ -n "$WIN_FILE" ]; then
            TS_WIN_KEY="${PROD_SLUG}/downloads/${PREFIX}-windows-cloud-${BUILD_TIMESTAMP}.exe"
            echo "⬆️ Uploading ${PREFIX}-windows-cloud-${BUILD_TIMESTAMP}.exe to Cloudflare R2..."
            aws s3 cp "$WIN_FILE" "s3://${R2_BUCKET}/${TS_WIN_KEY}" \
              --endpoint-url "$R2_ENDPOINT"

            WIN_URL="${BASE_URL}/${TS_WIN_KEY}"
            echo "✅ Windows (.exe): ${WIN_URL}"

            # Fetch current latest.json if exists or update
            EXISTING_MANIFEST=$(curl -s "${BASE_URL}/${PROD_SLUG}/downloads/latest.json" || true)
            EXISTING_MAC=$(echo "$EXISTING_MANIFEST" | node -e "const fs=require('fs'); try { const d=JSON.parse(fs.readFileSync(0,'utf8')); console.log(d.macos||''); } catch { console.log(''); }")

            LATEST_JSON_FILE="latest.json"
            cat <<EOF > "$LATEST_JSON_FILE"
            {
              "timestamp": "$BUILD_TIMESTAMP",
              "macos": "$EXISTING_MAC",
              "windows": "$WIN_URL",
              "linux": ""
            }
            EOF

            aws s3 cp "$LATEST_JSON_FILE" "s3://${R2_BUCKET}/${PROD_SLUG}/downloads/latest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json"

            # Purge Cloudflare CDN Cache
            if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ]; then
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"files\":[\"${WIN_URL}\", \"${BASE_URL}/${PROD_SLUG}/downloads/latest.json\"]}"
            fi
          fi
